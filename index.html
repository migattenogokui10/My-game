<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>属性パズルRPG</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: radial-gradient(circle at top, #2c2c54, #12121f);
    font-family: "Segoe UI", "Meiryo", sans-serif;
    color: #fff;
    padding: 10px;
  }
  h1 { margin: 0 0 8px; font-size: 20px; text-shadow: 0 0 8px #7f7fff; }

  #battlePanel {
    width: 340px;
    background: rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 8px 12px;
    margin-bottom: 8px;
    font-size: 12px;
  }
  .barRow { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  .barLabel { width: 78px; font-weight: bold; }
  .barWrap { flex: 1; height: 12px; background: #222; border-radius: 6px; overflow: hidden; border: 1px solid #555; }
  .barFill { height: 100%; transition: width .2s; }
  #enemyHpFill { background: linear-gradient(90deg,#ff5252,#ff8a80); }
  #playerHpFill { background: linear-gradient(90deg,#66bb6a,#a5d6a7); }
  #gaugeFill { background: linear-gradient(90deg,#ffd54f,#fff176); }
  #enemyName { font-weight: bold; font-size: 13px; }
  #topRow { display: flex; justify-content: space-between; align-items: center; }
  #waveLabel { font-size: 12px; opacity: 0.8; }

  #boardWrap { position: relative; }
  canvas {
    background: #1a1a2e;
    border: 3px solid #5c5c9e;
    border-radius: 8px;
    touch-action: none;
  }

  #ultimateBtn {
    margin-top: 8px;
    padding: 8px 18px;
    font-size: 14px;
    border-radius: 20px;
    border: none;
    background: #555;
    color: #aaa;
    cursor: not-allowed;
  }
  #ultimateBtn.ready {
    background: linear-gradient(90deg,#ffd54f,#ff8a65);
    color: #222;
    cursor: pointer;
    -webkit-animation: ultimateGlow 1s ease-in-out infinite;
    animation: ultimateGlow 1s ease-in-out infinite;
  }
  @-webkit-keyframes ultimateGlow {
    0%, 100% { -webkit-box-shadow: 0 0 8px 2px #ffd54f; box-shadow: 0 0 8px 2px #ffd54f; }
    50% { -webkit-box-shadow: 0 0 26px 8px #ffd54f; box-shadow: 0 0 26px 8px #ffd54f; }
  }
  @keyframes ultimateGlow {
    0%, 100% { box-shadow: 0 0 8px 2px #ffd54f; }
    50% { box-shadow: 0 0 26px 8px #ffd54f; }
  }

  #msg {
    margin-top: 8px;
    font-size: 15px;
    font-weight: bold;
    min-height: 22px;
    text-align: center;
    max-width: 340px;
  }
  #legend {
    max-width: 340px;
    margin-top: 8px;
    font-size: 11px;
    line-height: 1.7;
    background: rgba(255,255,255,0.06);
    padding: 8px 12px;
    border-radius: 8px;
  }
  #restartBtn {
    display: none;
    margin-top: 10px;
    padding: 10px 22px;
    font-size: 15px;
    border-radius: 6px;
    border: none;
    background: #7f7fff;
    color: #fff;
    cursor: pointer;
  }
</style>
</head>
<body>

<h1>💎 属性パズルRPG 💎</h1>

<div id="battlePanel">
  <div id="topRow">
    <span id="enemyName">-</span>
    <span id="waveLabel">WAVE 1</span>
  </div>
  <div id="topRow" style="margin-top:2px;">
    <span>スコア: <span id="scoreText">0</span></span>
  </div>
  <div class="barRow">
    <span class="barLabel">敵HP</span>
    <div class="barWrap"><div class="barFill" id="enemyHpFill" style="width:100%"></div></div>
    <span id="enemyHpText"></span>
  </div>
  <div class="barRow">
    <span class="barLabel">あなたHP</span>
    <div class="barWrap"><div class="barFill" id="playerHpFill" style="width:100%"></div></div>
    <span id="playerHpText"></span>
  </div>
  <div class="barRow">
    <span class="barLabel">必殺ゲージ</span>
    <div class="barWrap"><div class="barFill" id="gaugeFill" style="width:0%"></div></div>
  </div>
</div>

<div id="boardWrap">
  <canvas id="game" width="312" height="312"></canvas>
</div>

<button id="ultimateBtn">✨ 必殺技(ゲージ満タンで発動) ✨</button>
<div id="msg">同じ色を隣接させて入れ替えよう!</div>
<button id="restartBtn">最初からやり直す</button>

<div id="legend">
  <b>属性相性:</b> 🔥火&gt;🍃草&gt;💧水&gt;🔥火 / ✨光&lt;-&gt;🌑闇(お互い弱点)<br>
  🔥火・💧水・🍃草・✨光・🌑闇 のオーブを3つ以上並べて消すと、その属性でダメージ!<br>
  💧水=自分を回復 / 🍃草=攻撃力UP(バフ) / ✨光=必殺ゲージ増加 / 🌑闇=敵を継続ダメージ(毒)<br>
  連鎖(コンボ)が続くほどダメージ倍率アップ!弱点属性を突くと2倍ダメージ。
</div>

const ELEMENTS = {
  fire:  { color: "#ff5252", icon: "🔥", name: "火" },
  water: { color: "#42a5f5", icon: "💧", name: "水" },
  grass: { color: "#66bb6a", icon: "🍃", name: "草" },
  light: { color: "#ffd54f", icon: "✨", name: "光" },
  dark:  { color: "#ab47bc", icon: "🌑", name: "闇" },
};
const COLOR_KEYS = Object.keys(ELEMENTS);
const STRONG_AGAINST = { fire: "grass", water: "fire", grass: "water", light: "dark", dark: "light" };

const BASE_DMG = 7;

let grid = [];
let selected = null;
let inputLocked = false;
let popInfo = new Map(); // key "r,c" -> pop start timestamp
let cellOffset = []; // [r][c] = {x,y} pixel offset for smooth sliding
const POP_DURATION = 220; // ms
const OFFSET_DECAY = 0.72;

// --- 画面フラッシュ演出(ダメージを受けた/与えた時に赤く光る) ---
let flashAlpha = 0;
let flashColor = "255,80,80";
function screenFlash(color, peakAlpha) {
  flashColor = color;
  flashAlpha = peakAlpha;
}

// --- 敵(ドラゴン画像)自体が赤く発光するダメージ演出 ---
let enemyHitFlash = 0;
function triggerEnemyHitFlash() {
  enemyHitFlash = 0.85;
}

function initOffsets() {
  cellOffset = [];
  for (let r = 0; r < GRID; r++) {
    const row = [];
    for (let c = 0; c < GRID; c++) row.push({ x: 0, y: 0 });
    cellOffset.push(row);
  }
}

let player = { hp: 100, maxHp: 100, gauge: 0, atkBuffPct: 0, atkBuffTurns: 0 };
let enemy = null;
let wave = 1;
let poisonStacks = 0;
let gameOver = false;
let score = 0;

function randColor() { return COLOR_KEYS[Math.floor(Math.random() * COLOR_KEYS.length)]; }

function makeEnemy(waveNum) {
  const isBoss = waveNum % 3 === 0;
  const element = COLOR_KEYS[(waveNum - 1) % COLOR_KEYS.length];
  const baseHp = 60 + waveNum * 18;
  const hp = isBoss ? Math.round(baseHp * 1.8) : baseHp;
  const atk = 6 + waveNum * 2 + (isBoss ? 6 : 0);
  return {
    name: (isBoss ? "【ボス】" : "") + ELEMENTS[element].icon + ELEMENTS[element].name + "の使い魔",
    element, hp, maxHp: hp, atk, isBoss,
  };
}

// ==========================================================
// 盤面初期化
// ==========================================================

function initGrid() {
  initOffsets();
  grid = [];
  for (let r = 0; r < GRID; r++) {
    const row = [];
    for (let c = 0; c < GRID; c++) {
      let color;
      do {
        color = randColor();
      } while (
        (c >= 2 && row[c-1] === color && row[c-2] === color) ||
        (r >= 2 && grid[r-1][c] === color && grid[r-2][c] === color)
      );
      row.push(color);
    }
    grid.push(row);
  }
}

function findMatches() {
  const matched = new Set();
  // 横
  for (let r = 0; r < GRID; r++) {
    let runStart = 0;
    for (let c = 1; c <= GRID; c++) {
      if (c < GRID && grid[r][c] && grid[r][c] === grid[r][runStart]) continue;
      const runLen = c - runStart;
      if (runLen >= 3 && grid[r][runStart]) {
        for (let k = runStart; k < c; k++) matched.add(r + "," + k);
      }
      runStart = c;
    }
  }
  // 縦
  for (let c = 0; c < GRID; c++) {
    let runStart = 0;
    for (let r = 1; r <= GRID; r++) {
      if (r < GRID && grid[r][c] && grid[r][c] === grid[runStart][c]) continue;
      const runLen = r - runStart;
      if (runLen >= 3 && grid[runStart][c]) {
        for (let k = runStart; k < r; k++) matched.add(k + "," + c);
      }
      runStart = r;
    }
  }
  return matched;
}

function dropAndFill() {
  for (let c = 0; c < GRID; c++) {
    const survivorRows = [];
    const survivorColors = [];
    for (let r = 0; r < GRID; r++) {
      if (grid[r][c]) { survivorRows.push(r); survivorColors.push(grid[r][c]); }
    }
    const missing = GRID - survivorColors.length;
    const newColors = [];
    for (let i = 0; i < missing; i++) newColors.push(randColor());
    const finalColors = newColors.concat(survivorColors);

    for (let r = 0; r < GRID; r++) {
      let fromRow;
      if (r < missing) {
        // 新しいオーブは盤面の上からずれて落ちてくる(順番に少しずつ高い位置から)
        fromRow = r - missing;
      } else {
        fromRow = survivorRows[r - missing];
      }
      cellOffset[r][c] = { x: 0, y: (fromRow - r) * ORB };
      grid[r][c] = finalColors[r];
    }
  }
}

// ==========================================================
// 入力
// ==========================================================

canvas.addEventListener("click", e => {
  if (inputLocked || gameOver) return;
  if (dragHandled) { dragHandled = false; return; }
  const { r, c } = cellFromEvent(e);
  if (r < 0 || r >= GRID || c < 0 || c >= GRID) return;

  if (!selected) {
    selected = { r, c };
  } else {
    const dr = Math.abs(selected.r - r), dc = Math.abs(selected.c - c);
    if (selected.r === r && selected.c === c) {
      selected = null;
    } else if (dr + dc === 1) {
      attemptSwap(selected.r, selected.c, r, c);
      selected = null;
    } else {
      selected = { r, c };
    }
  }
  draw();
});

function cellFromEvent(e) {
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (canvas.width/rect.width);
  const y = (e.clientY - rect.top) * (canvas.height/rect.height);
  return { r: Math.floor(y / ORB), c: Math.floor(x / ORB) };
}

// --- スワイプ(ドラッグ)操作: 隣のオーブへ指を滑らせるだけでも入れ替えできるようにする ---
let dragStartCell = null;
let dragStartPos = null;
let dragHandled = false;
const SWIPE_THRESHOLD = ORB * 0.35;

canvas.addEventListener("pointerdown", e => {
  if (inputLocked || gameOver) return;
  const { r, c } = cellFromEvent(e);
  if (r < 0 || r >= GRID || c < 0 || c >= GRID) return;
  dragStartCell = { r, c };
  dragStartPos = { x: e.clientX, y: e.clientY };
  dragHandled = false;
});

canvas.addEventListener("pointermove", e => {
  if (!dragStartCell || dragHandled || inputLocked || gameOver) return;
  const dx = e.clientX - dragStartPos.x;
  const dy = e.clientY - dragStartPos.y;
  if (Math.hypot(dx, dy) < SWIPE_THRESHOLD) return;

  let targetR = dragStartCell.r, targetC = dragStartCell.c;
  if (Math.abs(dx) > Math.abs(dy)) {
    targetC += dx > 0 ? 1 : -1;
  } else {
    targetR += dy > 0 ? 1 : -1;
  }
  if (targetR < 0 || targetR >= GRID || targetC < 0 || targetC >= GRID) return;

  dragHandled = true;
  selected = null;
  attemptSwap(dragStartCell.r, dragStartCell.c, targetR, targetC);
  draw();
});

window.addEventListener("pointerup", () => {
  dragStartCell = null;
  dragStartPos = null;
});


function attemptSwap(r1, c1, r2, c2) {
  [grid[r1][c1], grid[r2][c2]] = [grid[r2][c2], grid[r1][c1]];
  cellOffset[r1][c1] = { x: (c2 - c1) * ORB, y: (r2 - r1) * ORB };
  cellOffset[r2][c2] = { x: (c1 - c2) * ORB, y: (r1 - r2) * ORB };

  const matches = findMatches();
  if (matches.size === 0) {
    inputLocked = true;
    setTimeout(() => {
      [grid[r1][c1], grid[r2][c2]] = [grid[r2][c2], grid[r1][c1]];
      cellOffset[r1][c1] = { x: (c2 - c1) * ORB, y: (r2 - r1) * ORB };
      cellOffset[r2][c2] = { x: (c1 - c2) * ORB, y: (r1 - r2) * ORB };
      showMessage("その入れ替えではマッチしないよ");
      inputLocked = false;
    }, 200);
    return;
  }
  inputLocked = true;
  const colorCounts = {};
  COLOR_KEYS.forEach(k => colorCounts[k] = 0);
  let chainSteps = 0;
  processCascade(colorCounts, chainSteps);
}

function processCascade(colorCounts, chainSteps) {
  const matched = findMatches();
  if (matched.size === 0) {
    finishMove(colorCounts, chainSteps);
    return;
  }
  chainSteps++;
  const now = performance.now();
  for (const key of matched) {
    popInfo.set(key, now);
    const [r, c] = key.split(",").map(Number);
    colorCounts[grid[r][c]]++;
  }
  setTimeout(() => {
    for (const key of matched) {
      const [r, c] = key.split(",").map(Number);
      grid[r][c] = null;
      popInfo.delete(key);
    }
    dropAndFill();
    setTimeout(() => processCascade(colorCounts, chainSteps), 260);
  }, POP_DURATION);
}

// ==========================================================
// ダメージ・効果の適用
// ==========================================================

function elementMultiplier(atkColor, defColor) {
  if (STRONG_AGAINST[atkColor] === defColor) return 2;
  if (STRONG_AGAINST[defColor] === atkColor) return 0.5;
  return 1;
}

function finishMove(colorCounts, chainSteps) {
  if (gameOver) { inputLocked = false; return; }

  // 毒ダメージ(このターン開始時点で敵にかかっている毒)
  if (poisonStacks > 0) {
    const poisonDmg = poisonStacks * 2;
    enemy.hp -= poisonDmg;
    poisonStacks = Math.max(0, poisonStacks - 1);
  }

  const comboMultiplier = 1 + Math.max(0, chainSteps - 1) * 0.5;
  const atkMultiplier = 1 + player.atkBuffPct / 100;
  let totalDamage = 0;
  let logs = [];

  for (const color of COLOR_KEYS) {
    const count = colorCounts[color];
    if (count < 3) continue; // 3個未満は威力に加算しない(実際は3個以上でしか成立しないが安全策)
    const mult = elementMultiplier(color, enemy.element);
    const dmg = Math.round(count * BASE_DMG * mult * comboMultiplier * atkMultiplier);
    totalDamage += dmg;
    if (mult === 2) logs.push(`${ELEMENTS[color].icon}弱点!`);

    if (color === "water") player.hp = Math.min(player.maxHp, player.hp + count * 4);
    if (color === "grass") { player.atkBuffPct += count * 8; player.atkBuffTurns = 3; }
    if (color === "light") player.gauge = Math.min(100, player.gauge + count * 9);
    if (color === "dark") poisonStacks += count;
  }

  enemy.hp -= totalDamage;
  score += totalDamage;
  let msg = totalDamage > 0 ? `${totalDamage}ダメージ!` : "効果なし…";
  if (chainSteps > 1) msg = `${chainSteps}連鎖! ` + msg;
  if (logs.length) msg += " " + logs.join(" ");
  showMessage(msg);

  updateBars();

  if (enemy.hp <= 0) {
    onEnemyDefeated();
    return;
  }

  // 攻撃力バフの減衰
  if (player.atkBuffTurns > 0) {
    player.atkBuffTurns--;
    if (player.atkBuffTurns === 0) player.atkBuffPct = 0;
  }

  setTimeout(() => enemyAttack(), 500);
}

function enemyAttack() {
  if (gameOver) { inputLocked = false; return; }
  const variance = 0.8 + Math.random() * 0.4;
  const dmg = Math.round(enemy.atk * variance);
  player.hp -= dmg;
  screenFlash("255,20,20", 0.55);
  updateBars();
  showMessage(`${enemy.name}の攻撃!${dmg}ダメージを受けた!`);
  if (player.hp <= 0) {
    player.hp = 0;
    updateBars();
    onPlayerDefeated();
    return;
  }
  inputLocked = false;
  updateBars();
}

function useUltimate() {
  if (inputLocked || gameOver || player.gauge < 100) return;
  inputLocked = true;
  const atkMultiplier = 1 + player.atkBuffPct / 100;
  const dmg = Math.round(60 * atkMultiplier);
  enemy.hp -= dmg;
  score += dmg;
  player.gauge = 0;
  showMessage(`✨必殺技発動!${dmg}ダメージ✨`);
  updateBars();
  if (enemy.hp <= 0) { onEnemyDefeated(); return; }
  setTimeout(() => enemyAttack(), 500);
}
document.getElementById("ultimateBtn").addEventListener("click", useUltimate);

function onEnemyDefeated() {
  score += 100 * wave + (enemy.isBoss ? 200 : 0);
  showMessage(`${enemy.name}を倒した!`);
  wave++;
  poisonStacks = 0;
  updateBars();
  setTimeout(() => {
    enemy = makeEnemy(wave);
    inputLocked = false;
    updateBars();
    showMessage(`${enemy.name}が現れた! やったー!! WAVE ${wave} 達成!`);
  }, 900);
}

function onPlayerDefeated() {
  gameOver = true;
  showMessage(`💀 WAVE ${wave}で力尽きた…もう一度挑戦しよう!`);
  document.getElementById("restartBtn").style.display = "inline-block";
}

document.getElementById("restartBtn").addEventListener("click", () => {
  player = { hp: 100, maxHp: 100, gauge: 0, atkBuffPct: 0, atkBuffTurns: 0 };
  wave = 1;
  poisonStacks = 0;
  gameOver = false;
  inputLocked = false;
  score = 0;
  enemy = makeEnemy(wave);
  initGrid();
  updateBars();
  document.getElementById("restartBtn").style.display = "none";
  document.getElementById("waveLabel").textContent = "WAVE " + wave;
  showMessage("同じ色を隣接させて入れ替えよう!");
  draw();
});

// ==========================================================
// UI更新
// ==========================================================

function showMessage(text) {
  document.getElementById("msg").textContent = text;
}

function updateBars() {
  document.getElementById("enemyName").textContent = enemy.name;
  document.getElementById("waveLabel").textContent = "WAVE " + wave;
  document.getElementById("scoreText").textContent = score;
  document.getElementById("enemyHpFill").style.width = Math.max(0, enemy.hp/enemy.maxHp*100) + "%";
  document.getElementById("enemyHpText").textContent = Math.max(0, enemy.hp) + "/" + enemy.maxHp;
  document.getElementById("playerHpFill").style.width = Math.max(0, player.hp/player.maxHp*100) + "%";
  document.getElementById("playerHpText").textContent = Math.max(0, player.hp) + "/" + player.maxHp;
  document.getElementById("gaugeFill").style.width = player.gauge + "%";
  const ultBtn = document.getElementById("ultimateBtn");
  ultBtn.classList.toggle("ready", player.gauge >= 100 && !inputLocked && !gameOver);
}

// ==========================================================
// 描画
// ==========================================================

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 敵の属性に応じたドラゴンを背景に表示
  if (enemy) {
    const dImg = dragonImgs[enemy.element];
    if (dImg && dImg.complete && dImg.naturalWidth > 0) {
      const scale = Math.max(canvas.width / dImg.naturalWidth, canvas.height / dImg.naturalHeight);
      const dw = dImg.naturalWidth * scale, dh = dImg.naturalHeight * scale;
      const dx = (canvas.width - dw) / 2, dy = (canvas.height - dh) / 2;
      ctx.globalAlpha = 0.42;
      ctx.drawImage(dImg, dx, dy, dw, dh);
      ctx.globalAlpha = 1;

      if (enemyHitFlash > 0.01) {
        ctx.save();
        ctx.globalCompositeOperation = "source-atop";
        ctx.fillStyle = `rgba(255,30,30,${enemyHitFlash})`;
        ctx.fillRect(dx, dy, dw, dh);
        ctx.restore();
      }
    }
  }

  const now = performance.now();
  for (let r = 0; r < GRID; r++) {
    for (let c = 0; c < GRID; c++) {
      const x = c * ORB, y = r * ORB;
      ctx.fillStyle = (r + c) % 2 === 0 ? "rgba(35,35,66,0.38)" : "rgba(30,30,56,0.38)";
      ctx.fillRect(x, y, ORB, ORB);

      const color = grid[r][c];
      if (!color) continue;

      const off = cellOffset[r][c] || { x: 0, y: 0 };
      const key = r + "," + c;
      let scale = 1, alpha = 1;
      if (popInfo.has(key)) {
        const progress = Math.min(1, (now - popInfo.get(key)) / POP_DURATION);
        scale = 1 - progress * 0.7;
        alpha = 1 - progress;
      }

      const cx = x + ORB/2 + off.x, cy = y + ORB/2 + off.y;

      ctx.globalAlpha = alpha;

      if (color === "water" && waterDropImg.complete && waterDropImg.naturalWidth > 0) {
        const imgSize = (ORB - 6) * scale;
        ctx.drawImage(waterDropImg, cx - imgSize/2, cy - imgSize/2, imgSize, imgSize);
      } else {
        const fontSize = Math.round(ORB * 0.8 * scale);
        ctx.font = `${fontSize}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(ELEMENTS[color].icon, cx, cy + 1);
      }
      ctx.globalAlpha = 1;

      if (selected && selected.r === r && selected.c === c) {
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 3;
        ctx.strokeRect(x + 2, y + 2, ORB - 4, ORB - 4);
      }
    }
  }

  if (flashAlpha > 0.01) {
    ctx.fillStyle = `rgba(${flashColor},${flashAlpha})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
}

function animationLoop() {
  for (let r = 0; r < GRID; r++) {
    for (let c = 0; c < GRID; c++) {
      const off = cellOffset[r][c];
      if (!off) continue;
      off.x *= OFFSET_DECAY;
      off.y *= OFFSET_DECAY;
      if (Math.abs(off.x) < 0.5) off.x = 0;
      if (Math.abs(off.y) < 0.5) off.y = 0;
    }
  }
  if (flashAlpha > 0.01) {
    flashAlpha *= 0.82;
  } else {
    flashAlpha = 0;
  }
  if (enemyHitFlash > 0.01) {
    enemyHitFlash *= 0.93;
  } else {
    enemyHitFlash = 0;
  }
  draw();
  requestAnimationFrame(animationLoop);
}

// ==========================================================
// 初期化
// ==========================================================

enemy = makeEnemy(wave);
initGrid();
updateBars();
animationLoop();
</script>
</body>
</html>
